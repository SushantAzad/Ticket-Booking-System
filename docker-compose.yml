services:
  postgres:
    image: postgres:16-alpine
    container_name: tbs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbs_user
      POSTGRES_PASSWORD: tbs_password
      POSTGRES_DB: ticket_booking
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tbs_user -d ticket_booking']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tbs_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
